<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Application Form - EVU</title>

<link rel="stylesheet" href="style.css">

</head>

<body >


<header class="navbar">

    <div class="logo"><img src="logo1.png" alt="EVU Logo"></div>

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="courses.html">Courses</a>
        <a href="admissions.html">Admissions</a>
        <a href="application.html">Application</a>
        <a href="contact.html">Contact</a>
    </nav>

</header>

<!-- APPLICATION SECTION -->
<section class="application-section">

    <div class="application-image">

        <img src="https://images.unsplash.com/photo-1523240795612-9a054b0db644">

    </div>

    <div class="application-form-container">

        <h1>University Application Form</h1>

        <p>
            Apply now to begin your journey at Eastern Valley University.
        </p>

        <form class="application-form">

            <input type="text"
            placeholder="Full Name"
            required>

            <input type="email"
            placeholder="Email Address"
            required>

            <input type="tel"
            placeholder="Phone Number"
            required>

            <input type="date">

            <select>
                <option>Select Department</option>
                <option>Computer Science</option>
                <option>Business Administration</option>
                <option>Electrical Engineering</option>
                <option>English Literature</option>
            </select>

            <textarea rows="5"
            placeholder="Why do you want to join EVU?"></textarea>

            <input type="file">

            <button type="submit">
                Submit Application
            </button>

        </form>

    </div>

</section>

<!-- FOOTER -->
<footer>

    <p>© 2026 Eastern Valley University</p>

</footer>

</body>
</html>
